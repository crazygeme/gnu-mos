# Pane applications use the installed 256-color screen terminfo entry.
set -g default-terminal 'screen-256color'
# MOS console output uses immediate wrapping and fixed-color scroll fills.
# ECH and alternate character sets are unsupported by the console renderer.
set -as terminal-overrides ',linux:am@:bce@:ech@:enacs@:smacs@:rmacs@:acsc@:U8=0'
# The MOS console implements indexed 256-color SGR sequences.
set -as terminal-overrides ',linux:colors=256:setaf=\E[38;5;%p1%dm:setab=\E[48;5;%p1%dm'
