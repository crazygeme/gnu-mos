# Xorg configuration for MOS VirtIO-GPU with VirGL acceleration.

Section "ServerLayout"
    Identifier  "MOS"
    Screen      0 "Screen0" 0 0
    InputDevice "Keyboard0" "CoreKeyboard"
    InputDevice "Mouse0" "CorePointer"
EndSection

Section "ServerFlags"
    Option "AutoAddDevices" "false"
    Option "AutoEnableDevices" "false"
    Option "AutoAddGPU" "false"
EndSection

Section "Files"
    ModulePath "/usr/lib/xorg/modules"
    FontPath   "built-ins"
EndSection

Section "InputDevice"
    Identifier "Keyboard0"
    Driver     "kbd"
    Option     "XkbRules"  "base"
    Option     "XkbModel"  "pc105"
    Option     "XkbLayout" "us"
EndSection

Section "InputDevice"
    Identifier "Mouse0"
    Driver     "mouse"
    Option     "Device"          "/dev/input/mice"
    Option     "Protocol"        "IMPS/2"
    Option     "ZAxisMapping"    "4 5"
    Option     "Emulate3Buttons" "no"
    Option     "SampleRate"      "200"
    Option     "AccelerationProfile" "-1"
    Option     "Sensitivity"     "2.0"
EndSection

Section "Monitor"
    Identifier  "Monitor0"
    HorizSync   31.5 - 160.0
    VertRefresh 50.0 - 144.0
EndSection

Section "Device"
    Identifier "Videocard0"
    Driver     "modesetting"
    Option     "kmsdev" "/dev/dri/card0"
    Option     "AccelMethod" "glamor"
    Option     "DRI" "3"
    Option     "SWcursor" "true"
    Option     "PageFlip" "false"
    Option     "Atomic" "false"
EndSection

Section "Screen"
    Identifier   "Screen0"
    Device       "Videocard0"
    Monitor      "Monitor0"
    DefaultDepth 24
    SubSection "Display"
        Depth   24
        Virtual 1920 1080
        Modes   "1920x1080"
    EndSubSection
EndSection
